<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Image</title>
    <style>
        body {
            background: #181818;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wireframe-flex {
            display: flex;
            gap: 32px;
            align-items: center;
            justify-content: center;
        }
        .img-container {
            background: #222;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 0 24px #000a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tablet-wireframe {
            max-width: 420px;
            max-height: 80vh;
        }
        .phone-wireframe {
            max-width: 220px;
            max-height: 60vh;
            padding: 16px;
            border-radius: 32px;
        }
        .img-container img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 16px #0006;
        }
    </style>
</head>
<body>
    <div class="wireframe-flex">
        <div class="img-container tablet-wireframe">
            <img src="./Project.png" alt="Tablet Wireframe">
        </div>
        <div class="img-container phone-wireframe">
            <img src="./Phone.png" alt="Phone Wireframe">
        </div>
    </div>
</body>
</html>
